# CyberPanel > Websites > zanaat.mustafaarslan.com > Manage > vHost Conf
# Bunu oldugu gibi yapistir, kaydet, sonra: systemctl restart lsws
#
# Butun istekler Node (Next.js) uygulamasina gidiyor; 404 sayfasini da o
# uretiyor, o yuzden diskten index.html servis eden bir kural yok. Sadece
# .well-known, Let's Encrypt dogrulamasi icin diskten gidiyor.

docRoot                   $VH_ROOT/public_html
vhDomain                  $VH_NAME
vhAliases                 www.$VH_NAME
adminEmails               admin@mustafaarslan.com
enableGzip                1
enableIpGeo               0

errorlog $VH_ROOT/logs/$VH_NAME.error_log {
  useServer               0
  logLevel                WARN
  rollingSize             10M
}

accesslog $VH_ROOT/logs/$VH_NAME.access_log {
  useServer               0
  logFormat               "%v %h %l %u %t "%r" %>s %b "%{Referer}i" "%{User-Agent}i""
  logHeaders              5
  rollingSize             10M
  keepDays                10
  compressArchive         1
}

expires {
  enableExpires           1
}

# Node uygulamasi: PM2 bunu 4300 portunda calistiriyor.
extprocessor zanaat {
  type                    proxy
  address                 127.0.0.1:4300
  maxConns                100
  initTimeout             60
  retryTimeout            0
  respBuffer              0
}

# Let's Encrypt dogrulamasi diskten gitmeli, uygulamaya degil.
context /.well-known/acme-challenge {
  location                $VH_ROOT/public_html/.well-known/acme-challenge
  allowBrowse             1
  addDefaultCharset       off
}

context / {
  type                    proxy
  handler                 zanaat
  addDefaultCharset       off
}

vhssl {
  keyFile                 /etc/letsencrypt/live/zanaat.mustafaarslan.com/privkey.pem
  certFile                /etc/letsencrypt/live/zanaat.mustafaarslan.com/fullchain.pem
  certChain               1
  sslSessionCache         1
  enableSpdy              15
  enableQuic              1
}
